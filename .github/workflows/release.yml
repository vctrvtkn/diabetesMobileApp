name: Publish Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID успешной сборки APK"
        required: true
        type: string
      version:
        description: "Версия приложения, например 0.1.3"
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-22.04

    steps:
      - name: Download APK from build
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          name: xe-calculator-v${{ inputs.version }}
          path: release
          github-token: ${{ github.token }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find release -type f -name '*.apk' -print -quit)
          test -n "$APK"

          gh release create "v${VERSION}" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "XE Calculator v${VERSION}" \
            --notes "Android APK"

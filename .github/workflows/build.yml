name: Build Android APK

on:
  workflow_dispatch:
  # push:
  #   branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get app version
        id: app_version
        shell: bash
        run: |
          VERSION=$(python3 - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path('main.py').read_text(encoding='utf-8'))
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  if any(isinstance(t, ast.Name) and t.id == '__version__' for t in node.targets):
                      version = ast.literal_eval(node.value)
                      if not isinstance(version, str) or not version:
                          raise SystemExit('Invalid __version__ in main.py')
                      print(version)
                      break
          else:
              raise SystemExit('App version not found in main.py')
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip python3-venv \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev \
            automake build-essential \
            libltdl-dev

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Buildozer
        run: |
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user \
            buildozer cython==0.29.34
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore Buildozer cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-v1
          restore-keys: |
            android-${{ runner.os }}-

      - name: Restore persistent Android debug signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]]; then
            echo "Missing GitHub secret ANDROID_DEBUG_KEYSTORE_BASE64" >&2
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey > /dev/null

      - name: Build Android APK
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"

          set +e
          yes | buildozer -v android debug
          build_status=${PIPESTATUS[1]}
          set -e

          exit "$build_status"
      
      - name: Verify APK signing certificate
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find bin -maxdepth 1 -name '*.apk' -type f | head -n 1)
          test -n "$APK"

          APKSIGNER=$(find "$HOME/.buildozer" \
            -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"

          EXPECTED=$(keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey |
            sed -n 's/^[[:space:]]*SHA256: //p' |
            head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')

          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' |
            head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')

          echo "Expected certificate: $EXPECTED"
          echo "Actual certificate:   $ACTUAL"

          if [[ -z "$EXPECTED" || -z "$ACTUAL" || "$EXPECTED" != "$ACTUAL" ]]; then
            echo "ERROR: APK signing certificate mismatch!"
            exit 1
          fi

          echo "APK signing certificate verified."
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xe-calculator-v${{ steps.app_version.outputs.version }}
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

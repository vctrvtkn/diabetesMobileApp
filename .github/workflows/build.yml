
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip python3-venv \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev \
            automake build-essential \
            libltdl-dev

      - name: Install Buildozer
        run: |
          python3 -m venv ~/buildozer-venv
          ~/buildozer-venv/bin/pip install --upgrade pip
          ~/buildozer-venv/bin/pip install \
            buildozer cython==0.29.34

      - name: Build Android APK
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
        run: |
          export PATH="$HOME/buildozer-venv/bin:$PATH"
          yes | buildozer -v android debug || {
            status=${PIPESTATUS[1]}
            exit "$status"
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xe-calculator-apk
          path: bin/*.apk
          if-no-files-found: error
